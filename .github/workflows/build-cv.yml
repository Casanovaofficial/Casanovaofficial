name: Build and publish CV

# Rebuilds the PDF and the web CV whenever the CV source changes,
# commits the fresh PDF back to the repo, and deploys the site to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - "scripts/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build PDF and site
        run: python scripts/build_cv.py

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/Erick_Casanova_CV.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Rebuild CV PDF"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
